<div class="container-fluid py-3">
  <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
    <div class="card-header bg-primary text-white py-2">
      <h5 class="mb-0">Selected Employee</h5>
    </div>

    <div class="card-body p-3"> 
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold text-secondary">Employee ID</label>
            <input type="text" [(ngModel)]="selectedEmployeeDetals().empId" class="form-control form-control-sm" value="101" readonly>
          </div>

          <div class="col-md-6">
            <label class="form-label small fw-semibold text-secondary">Name</label>
            <input type="text" [(ngModel)]="selectedEmployeeDetals().name" class="form-control form-control-sm" value="Aarav Sharma" readonly>
          </div>

          <div class="col-md-6">
            <label class="form-label small fw-semibold text-secondary">Role</label>
            <input type="text" [(ngModel)]="selectedEmployeeDetals().role" class="form-control form-control-sm" value="Software Engineer" readonly>
          </div>

          <div class="col-md-6">
            <label class="form-label small fw-semibold text-secondary">Department</label>
            <input type="text" [(ngModel)]="selectedEmployeeDetals().department" class="form-control form-control-sm" value="Engineering" readonly>
          </div>

          <div class="col-md-6">
            <label class="form-label small fw-semibold text-secondary">Location</label>
            <input type="text" [(ngModel)]="selectedEmployeeDetals().location" class="form-control form-control-sm" value="Bengaluru" readonly>
          </div>

          <div class="col-md-6">
            <label class="form-label small fw-semibold text-secondary">Mobile</label>
            <input type="text" class="form-control form-control-sm" value="+91 98765 43210" readonly>
          </div>

          <div class="col-12">
            <label class="form-label small fw-semibold text-secondary">Email</label>
            <input type="email" class="form-control form-control-sm" value="aarav.sharma@company.com" readonly>
          </div>
        </div> 
    </div>
  </div>
</div>
