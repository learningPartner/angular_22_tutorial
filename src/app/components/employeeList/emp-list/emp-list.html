<div class="container-fluid py-2 employee-list-wrapper">
  <div class="row g-2 employee-grid">
    <div
      class="col-12"
      *ngFor="let employee of employees"
    >
      <div class="card employee-card h-100 border-0 shadow-sm">
        <div class="card-body p-2">
          <h6 class="employee-name mb-2 text-truncate">{{ employee.name }}</h6>
          <div class="employee-meta text-muted small mb-1">{{ employee.mobile }}</div>
          <div class="employee-meta text-muted small text-truncate">{{ employee.email }}</div>
          <div>
            <button class="btn btn-primary" [routerLink]="['/admin/employee',{outlets:{detailOutlet: ['detail',employee.empId]}}]">Open</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
