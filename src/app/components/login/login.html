<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Login</h3>

                    <form  >
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" [(ngModel)]="loginObj.EmailId" class="form-control" id="email" name="EmailId"
                                placeholder="Enter your email" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" [(ngModel)]="loginObj.Password"  class="form-control" id="Password" name="Password"
                                placeholder="Enter your password" required>
                        </div>

                        <div class="d-grid">
                            <button type="button" (click)="onLogin()" class="btn btn-primary">
                                Login
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
