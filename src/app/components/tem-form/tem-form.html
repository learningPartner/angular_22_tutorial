<div class="row">
    <div class="col-8">
        <div class="card">
            <div class="card-header bg-warning">
                Company List
            </div>
            <div class="card-body">

            </div>
        </div>
    </div>
    <div class="col-4">
        <div class="card">
            <div class="card-header bg-warning">
                New Company
            </div>
            <div class="card-body">
                <form #form="ngForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="companyName" class="form-label">Company Name</label>
                            <input type="text" #comName="ngModel" [(ngModel)]="companyObj.companyName" required minlength="5" class="form-control"  name="companyName"
                                placeholder="Enter company name" />
                                <div class="text-danger"> 
                                    @if(comName.errors?.['required']){
                                            <span>This is Required</span>
                                    }
                                    @if(comName.errors?.['minlength']) {
                                            <span>Min 5 Char is Required</span>
                                    }
                                    
                                </div>
                        </div>

                        <div class="col-md-6">
                            <label for="pinCode" class="form-label">Pin Code</label>
                            <input type="text" #pinTem="ngModel" (ngModelChange)="onPinchange()" [(ngModel)]="companyObj.pinCode" required minlength="6" class="form-control" name="pinCode"
                                placeholder="Enter pin code" />
                                <div class="text-danger">
                                    @if (pinTem.errors?.['required']) {
                                        <span>Required</span>
                                    }
                                    @if (pinTem.errors?.['minlength']) {
                                        <span>Min 6 Char needed</span>
                                    }
                                </div>
                        </div>

                        <div class="col-md-6">
                            <label for="address" class="form-label">Address</label>
                            <textarea class="form-control" [(ngModel)]="companyObj.address"  name="address" rows="3"
                                placeholder="Enter address"></textarea>
                        </div>

                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="text" [(ngModel)]="companyObj.phone" required minlength="10" maxlength="10" class="form-control" name="phone"
                                placeholder="Enter phone number" />
                        </div>

                        <div class="col-12 text-end mt-4">
                            <button type="button" [disabled]="form.invalid" (click)="onSaveCompany(form)" class="btn btn-primary me-2">
                                Save
                            </button>

                            <button type="reset" class="btn btn-secondary">
                                Reset
                            </button>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
