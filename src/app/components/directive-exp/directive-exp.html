<div class="row">
    <div class="col-3">
        <div class="p-4" [ngClass]="divClassName">
            Div 1
        </div>
    </div>
    <div class="col-3">
        <div class="p-3" [ngClass]="isCheckActive == true ?'bg-warning' :'bg-primary'">
            Div 2
        </div>
    </div>
    <div class="col-3">
        <input type="text" [(ngModel)]="num1" class="form-control" placeholder="Enter 5 Char Only" />
        <h1 [ngClass]="num1.length > 5 ?'text-danger':'text-success'">
            {{num1.length > 5 ?'Text Is InValid':'Text is Valid'}}
        </h1>
    </div>
    <div class="col-3">
        <input type="text" [(ngModel)]="num1" class="form-control" placeholder="Enter 5 Char Only" />
        <h1 [ngClass]="isTextValid?'text-danger':'text-success'">
            {{num1.length > 5 ?'Text Is InValid':'Text is Valid'}}
        </h1>
    </div>
</div>
<hr>
<div class="row">
    <div class="col-3">
        <button (click)="addDiv1Class('bg-success')" class="btn btn-success">Succes</button>
        <button (click)="addDiv1Class('bg-danger')" class="btn btn-danger">Danger</button>
    </div>
    <div class="col-3">
        <input type="checkbox" [(ngModel)]="isCheckActive">
        -{{isCheckActive}}
    </div>
    <div class="col-3">
        <button (click)="checkCharLength()" class="btn btn-success">Check Length</button>
    </div>
</div>

<hr>
<hr>
<div class="row">
    <div class="col-3">
        <div class="p-3" [ngStyle]="{'background-color':inputColorValue }">
            Div 3
        </div>
    </div>
    <div class="col-3">
        <div [ngStyle]="div4Css">
            div 4
        </div>
    </div>
</div>
<hr>
<div class="row">
    <div class="col-3"> 
        <input type="color" [(ngModel)]="inputColorValue"> 
    </div>
    <div class="col-3">
        <button (click)="changeType('circle')">Circle </button>
         <button (click)="changeType('square')">Square </button>
    </div>
</div>
